# frontrails.yaml — FrontRails capabilities as a Flowgate pattern pack.
# Consumers merge this via `include:`. FrontRails itself is never modified.
#
# Each FrontRails MCP server exposes ONE tool (intentos / structureos /
# securityos / uxos) that takes an `action` discriminator + `params`. So each
# ACTION becomes its own Flowgate capability: it calls the one tool with a fixed
# `action` and templates the caller's `params` in via `$.arguments.params`.
#
# The binding key is `map:` — NOT `arguments:`. The `mcp` executor reads only
# `connection` + `tool` + `map` (see praxec docs/authoring-reference.md; the
# executor literally does `cfg.get("map")`). An `arguments:` block is silently
# IGNORED, and with no `map:` the caller's raw args pass straight through — so
# the pinned `action` never reaches the tool and every call is malformed. That
# was the v1.2.0 bug. `map:` resolves recursively, so a nested `params: { … }`
# object mixing literals and `$.` paths is the correct shape.
#
# OPTIONAL params (v1.3.1): a bare `$.arguments.params` binding HARD-FAILS
# (MCP_MAP_BINDING_UNRESOLVED) when the caller omits `params`. Where `params` is
# OPTIONAL (not in the action's `inputSchema.required`) the binding is wrapped
# `{ "$optional": "$.arguments.params" }`, which OMITS the key when the value is
# absent instead of failing — so a proxy session can start without pre-supplying
# args to every read verb. Required actions (propose / simulate_and_project /
# structureos.move; and the uxos verbs' `ir`) keep the bare binding, so a missing
# required arg still fails loud. praxec `check` enforces this split (V29-optional).
#
# ASYNC-HITL (FrontRails 0.0.17): mutating IntentOS actions are human-gated.
# When a mutation cannot reach a human — as in this headless/agent context —
# `propose`, `review_strategy` and `request_full_review` no longer wedge or
# fail closed: they PARK the change as a durable approval ticket and return
# `status: "pending_approval"` + a `ticket_id`. The change is NOT applied until
# a human approves it through IntentOS's own dialog channel (an agent
# structurally cannot self-approve — that gate stays authoritative here). Poll
# the ticket with `intentos.propose_status { ticket_id }`; a burn-down loop
# should surface the ticket_id and move on to other worklist items rather than
# block. See the `intentos.propose_status` capability and the workflow goals.
version: "1.3.1"

connections:
  intentos:
    kind: mcp
    command: "intent"
    args: ["mcp", "serve"]
    env:
      INTENTOS_SPEC_ROOT: "."
      INTENTOS_WORKSPACE_ROOT: "."

  # StructureOS MCP server. `structureos-mcp` serves over stdio with no
  # subcommand (verified: `structureos-mcp --help` shows `Usage: structureos-mcp`).
  structureos:
    kind: mcp
    command: "structureos-mcp"
    env:
      STRUCTUREOS_WORKSPACE_ROOT: "."

  # SecurityOS MCP server. CONFIRMED 2026-07-27: the installed binary is
  # `securityos-mcp` (stdio, no subcommand) — same shape as structureos-mcp /
  # uxos-mcp. The earlier `securityos` + `mcp serve` guess was wrong (that name
  # is not on PATH); corrected to the real binary.
  securityos:
    kind: mcp
    command: "securityos-mcp"
    env:
      SECURITYOS_WORKSPACE_ROOT: "."

  # uxos (UX conformance) MCP server. `uxos-mcp` serves over stdio with no
  # subcommand. Like the other *os servers it exposes ONE tool (`uxos`) taking
  # an `action` discriminator + `params`.
  uxos:
    kind: mcp
    command: "uxos-mcp"
    env:
      UXOS_WORKSPACE_ROOT: "."

capabilities:
  intentos.status:
    title: "IntentOS — spec status, diagnostics, next steps"
    description: "Read spec health, diagnostics, gate progression, drift."
    tags: [intentos, read]
    inputSchema:
      type: object
      properties: {}
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "status"

  intentos.search_intent_harness:
    title: "IntentOS — search existing intent entities (grounding)"
    description: "Search the intent harness for existing entities to ground proposals in."
    tags: [intentos, read]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "search_intent_harness"
        params: { "$optional": "$.arguments.params" }

  intentos.propose:
    title: "IntentOS — propose grounded spec changes"
    description: "Add/modify/delete/link spec entities; requires grounded_in."
    tags: [intentos, write]
    inputSchema:
      type: object
      required: [params]
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "propose"
        params: "$.arguments.params"

  intentos.navigate:
    title: "IntentOS — position in the intent topology"
    description: "Position the cursor in the intent graph before authoring."
    tags: [intentos, read]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "navigate"
        params: { "$optional": "$.arguments.params" }

  intentos.finish:
    title: "IntentOS — capture impact + feedback, surface remaining work"
    description: "Close the session, capture impact, and surface remaining work."
    tags: [intentos, write]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "finish"
        params: { "$optional": "$.arguments.params" }

  intentos.simulate_and_project:
    title: "IntentOS — run Preveti/Simuli and project into the compass"
    description: >
      Start a Preveti/Simuli simulation run, wait for it, and project the vetted
      result into the OpportunityCompass (evidence-first, via the fail-closed
      compass_write gate). params: { objective: string, audience_json: object,
      spec_path?: string, external_id?: string }. Network + write.
    tags: [intentos, write, preveti]
    inputSchema:
      type: object
      required: [params]
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "simulate_and_project"
        params: "$.arguments.params"

  intentos.worklist:
    title: "IntentOS — prioritized intent worklist (the frontier)"
    description: >
      The ranked to-do list combining conflicts, coverage gaps and diagnostics —
      each item carries a suggested_action ({mcp_action, params}), a target_entity_id,
      gate_eligible, and owning_role. The burn-down loop reads this each iteration to
      pick the highest-ranked item to resolve.
    tags: [intentos, read]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "worklist"
        params: { "$optional": "$.arguments.params" }

  intentos.certify:
    title: "IntentOS — certify (apex gate: attested + no conflicts)"
    description: >
      The apex check. passed == true iff every in-scope entity is attested + intact
      AND there are no gate-eligible conflicts. Optional params.target_id scopes to a
      vertical (climb_column). The burn-down loop uses certify as a done-condition;
      coding/authoring stays advisory (certify never mutates).
    tags: [intentos, read]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "certify"
        params: { "$optional": "$.arguments.params" }

  intentos.propose_status:
    title: "IntentOS — poll an async approval ticket (park → apply status)"
    description: >
      Read-only poll of a durable approval ticket. When a mutating action cannot
      reach a human it PARKS the change and returns status=pending_approval + a
      ticket_id instead of applying synchronously (see the ASYNC-HITL note at the
      top of this pack). Call propose_status with that ticket_id to read the
      outcome: pending (awaiting human approval), applied (carries the full result
      payload), rejected, failed, or expired. With no ticket_id it lists all
      pending tickets. This handler has NO write path — it can never approve or
      transition a ticket (approval flows only through the human-only dialog).
    tags: [intentos, read]
    inputSchema:
      type: object
      properties:
        params:
          type: object
          properties:
            ticket_id: { type: string }
    executor:
      kind: mcp
      connection: intentos
      tool: "intentos"
      map:
        action: "propose_status"
        params: { "$optional": "$.arguments.params" }

  # --- StructureOS (code structure) ---
  # OPEN ITEM: action names below are best-effort from the StructureOS
  # workflow docs (scan_repo / get_diagnostics / move). Verify against the
  # live server's action discriminator before relying on them.
  structureos.scan_repo:
    title: "StructureOS — scan repo, populate analysis cache"
    description: "Populate the scan cache so metrics/treeview/diagnostics work."
    tags: [structureos, write]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: structureos
      tool: "structureos"
      map:
        action: "scan_repo"
        params: { "$optional": "$.arguments.params" }

  structureos.get_diagnostics:
    title: "StructureOS — structural diagnostics"
    description: "View structural issues (god files, cycles) after a scan."
    tags: [structureos, read]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: structureos
      tool: "structureos"
      map:
        action: "get_diagnostics"
        params: { "$optional": "$.arguments.params" }

  structureos.move:
    title: "StructureOS — move entities with auto-wiring"
    description: "Move functions/types between files; rewires imports + re-exports."
    tags: [structureos, write]
    inputSchema:
      type: object
      required: [params]
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: structureos
      tool: "structureos"
      map:
        action: "move"
        params: "$.arguments.params"

  # --- SecurityOS ---
  # OPEN ITEM: action name `scan` is best-effort and the server itself is
  # unconfirmed (see the securityos connection note).
  securityos.scan:
    title: "SecurityOS — security scan"
    description: "Run a security scan over the workspace."
    tags: [securityos, read]
    inputSchema:
      type: object
      properties:
        params: { type: object }
    executor:
      kind: mcp
      connection: securityos
      tool: "securityos"
      map:
        action: "scan"
        params: { "$optional": "$.arguments.params" }

  # --- uxos (UX conformance) ---
  # CONFORMANCE verbs, not intentos clones: intentos AUTHORS intent, uxos
  # COMPUTES how understandable/operable a realization is. Every uxos verb is
  # read-only (it evaluates a model, never mutates a spec), so none is gated.
  uxos.extract:
    title: "uxos — extract a UX-IR from a raw capture (DOM / a11y tree)"
    description: >
      Deterministically turn an HTML document (`html`) or a CDP accessibility tree
      (`a11y_tree`) into a validated UX-IR over the structural projection, with a
      provenance trail so the capture is re-hashable for drift. The starting point
      before conform/audit on a real page.
    tags: [uxos, read]
    inputSchema:
      type: object
      properties:
        html: { type: string }
        a11y_tree: { type: string }
    executor:
      kind: mcp
      connection: uxos
      tool: "uxos"
      map:
        action: "extract"
        params:
          html: { "$optional": "$.arguments.html" }
          a11y_tree: { "$optional": "$.arguments.a11y_tree" }

  uxos.conform:
    title: "uxos — run all quality rules (verdicts with epistemic class + dimension)"
    description: >
      Evaluate every quality rule against the UX-IR and return verdicts, each tagged
      deterministic vs advisory (a verdict touching any LLM-inferred input is advisory)
      and named by dimension. Enumerates dimensions NOT covered so a clean run can't
      hide a blind spot. Also reports dead ends + flow gaps.
    tags: [uxos, read]
    inputSchema:
      type: object
      required: [ir]
      properties:
        ir: { type: object }
    executor:
      kind: mcp
      connection: uxos
      tool: "uxos"
      map:
        action: "conform"
        params:
          ir: "$.arguments.ir"

  uxos.scan_dark_patterns:
    title: "uxos — dark-patterns-structural@1 (sneaking/nagging/forced-action/preselection)"
    description: >
      Run the structural dark-patterns pack. Each finding is a topological fact with an
      inspectable rationale (a modal that dominates a required flow = forced-action; a
      choice control defaulting opt-in = preselection; …) — a deterministic verdict, not
      an opinion.
    tags: [uxos, read]
    inputSchema:
      type: object
      required: [ir]
      properties:
        ir: { type: object }
    executor:
      kind: mcp
      connection: uxos
      tool: "uxos"
      map:
        action: "scan_dark_patterns"
        params:
          ir: "$.arguments.ir"

  uxos.audit:
    title: "uxos — audit an experience (conformance + completeness ladder + dark patterns)"
    description: >
      One-shot rollup: all verdicts, the D5-inverted quantified completeness ladder
      (highest reached rung + per-rung shortfall; behavior is the floor, screens a
      realization tier above it), and the structural dark-patterns pack. The headline
      "how good is this experience" verb.
    tags: [uxos, read]
    inputSchema:
      type: object
      required: [ir]
      properties:
        ir: { type: object }
    executor:
      kind: mcp
      connection: uxos
      tool: "uxos"
      map:
        action: "audit"
        params:
          ir: "$.arguments.ir"

  uxos.check_coverage:
    title: "uxos — crossmatrix drift vs intent (stale / orphan / uncovered)"
    description: >
      The intent↔ux federation drift report: given the crossmatrix engine's mapping
      cells and a coverage policy (kinds that must be mapped), return the three distinct
      findings — stale (a cited member's content changed), orphan (a cited member is
      gone), uncovered (a required member no cell maps). uxos never holds the mappings;
      it re-computes drift against its current roster.
    tags: [uxos, read]
    inputSchema:
      type: object
      required: [ir]
      properties:
        ir: { type: object }
        cells: { type: array, items: { type: object } }
        require_covered_kinds: { type: array, items: { type: string } }
    executor:
      kind: mcp
      connection: uxos
      tool: "uxos"
      map:
        action: "check_coverage"
        params:
          ir: "$.arguments.ir"
          cells: { "$optional": "$.arguments.cells" }
          require_covered_kinds: { "$optional": "$.arguments.require_covered_kinds" }

  uxos.compare:
    title: "uxos — structural diff of two captures (regression surface)"
    description: >
      Diff two UX-IR captures by member content hash: added / removed / changed node
      ids. The muscle-memory / regression surface across two snapshots of the same
      surface.
    tags: [uxos, read]
    inputSchema:
      type: object
      required: [before, after]
      properties:
        before: { type: object }
        after: { type: object }
    executor:
      kind: mcp
      connection: uxos
      tool: "uxos"
      map:
        action: "compare"
        params:
          before: "$.arguments.before"
          after: "$.arguments.after"

proxy:
  expose:
    - { capability: intentos.status, tags: [primary], aliases: [status, health] }
    - { capability: intentos.search_intent_harness, aliases: [search, ground] }
    - { capability: intentos.propose, tags: [primary], aliases: [propose, change] }
    - { capability: intentos.propose_status, aliases: [propose_status, ticket, poll] }
    - { capability: intentos.navigate, aliases: [navigate, position] }
    - { capability: intentos.worklist, tags: [primary], aliases: [worklist, frontier, todo] }
    - { capability: intentos.certify, tags: [primary], aliases: [certify, gate] }
    - { capability: intentos.finish, aliases: [finish, close] }
    - { capability: intentos.simulate_and_project, aliases: [simulate, preveti, compass_populate] }
    - { capability: structureos.scan_repo, tags: [primary], aliases: [scan, scan_repo] }
    - { capability: structureos.get_diagnostics, aliases: [diagnostics, structure_diagnostics] }
    - { capability: structureos.move, tags: [primary], aliases: [move, refactor] }
    - { capability: securityos.scan, tags: [primary], aliases: [security_scan] }
    - { capability: uxos.extract, aliases: [extract, capture] }
    - { capability: uxos.conform, aliases: [conform] }
    - { capability: uxos.scan_dark_patterns, aliases: [dark_patterns] }
    - { capability: uxos.audit, tags: [primary], aliases: [audit, ux_audit] }
    - { capability: uxos.check_coverage, aliases: [ux_coverage, crossmatrix_drift] }
    - { capability: uxos.compare, aliases: [ux_compare] }

workflows:
  frontrails_spec:
    description: >
      Drive IntentOS to a goal by following its own HATEOAS hints. The running
      LLM picks each transition; FrontRails' gates stay authoritative. No journey
      logic is re-encoded here — every transition IS an exposed capability.
    initialState: working
    maxChainDepth: 50
    states:
      working:
        goal: >
          Follow IntentOS _required/_available hints until the spec is healthy. If a
          propose returns status=pending_approval it parked an approval ticket (no human
          reachable here) — record the ticket_id, poll it with propose_status, and move
          on; a human approves it through IntentOS's own dialog. Do not treat a parked
          ticket as failure.
        transitions:
          status:         { target: working, actor: agent, executor: { capability: intentos.status } }
          search:         { target: working, actor: agent, executor: { capability: intentos.search_intent_harness } }
          propose:        { target: working, actor: agent, executor: { capability: intentos.propose } }
          propose_status: { target: working, actor: agent, executor: { capability: intentos.propose_status } }
          navigate:       { target: working, actor: agent, executor: { capability: intentos.navigate } }
          finish:         { target: done, actor: agent, executor: { capability: intentos.finish } }
      done:
        terminal: true

  frontrails_ux_conformance:
    description: >
      Assess the UX conformance of a real surface with uxos. From a raw capture
      (html / a11y_tree) extract a UX-IR, then audit it (conformance + completeness
      ladder + dark patterns). uxos verbs are read-only — this workflow computes and
      reports; it never mutates a spec. The running LLM decides whether to drill into
      dark patterns or coverage after the audit.
    initialState: assessing
    maxChainDepth: 20
    states:
      assessing:
        goal: >
          If given a raw capture, call `extract` to get a UX-IR first. Then call `audit`
          on the IR for the full rollup (verdicts by epistemic class + dimension, the
          completeness ladder's highest reached rung, and structural dark patterns).
          Drill in with `dark_patterns` or `conform` for detail, or `ux_coverage` to
          check drift against intent. Report findings; do not fabricate numbers — every
          verdict already carries whether it is deterministic or advisory. Call `report`
          when the assessment is complete.
        transitions:
          extract:       { target: assessing, actor: agent, executor: { capability: uxos.extract } }
          audit:         { target: assessing, actor: agent, executor: { capability: uxos.audit } }
          conform:       { target: assessing, actor: agent, executor: { capability: uxos.conform } }
          dark_patterns: { target: assessing, actor: agent, executor: { capability: uxos.scan_dark_patterns } }
          ux_coverage:   { target: assessing, actor: agent, executor: { capability: uxos.check_coverage } }
          ux_compare:    { target: assessing, actor: agent, executor: { capability: uxos.compare } }
          report:        { target: done, actor: agent }
      done:
        terminal: true

  frontrails_burndown:
    description: >
      Burn down the IntentOS worklist after one user kickoff. Each iteration: read the
      prioritized frontier (worklist), resolve the highest-ranked item by calling its
      suggested action (typically propose, grounded in the item's target), then re-read.
      Stop when the worklist is empty or `certify` reports passed=true. The running LLM
      drives; IntentOS gates + the worklist ranking stay authoritative — no ordering or
      gate logic is re-encoded here (every transition IS an exposed capability).
      maxChainDepth caps runaway / token burn.
    initialState: burndown
    maxChainDepth: 60
    states:
      burndown:
        goal: >
          Call `worklist` to get the ranked frontier. If it is empty — or `certify`
          reports passed=true — call `finish` to close out. Otherwise take the
          top-ranked item, ground it via `search`/`navigate` if needed, and resolve it
          by calling its suggested_action (usually `propose`, using the item's params).
          Then loop: call `worklist` again to re-rank. Never force a change onto attested
          intent — write-protection diverts such proposals to candidates; surface the
          captured candidate rather than retrying. Prefer gate_eligible items first.
          If a propose returns status=pending_approval it parked an approval ticket (no
          human reachable in this loop): record the ticket_id, optionally poll it with
          propose_status, and continue burning down OTHER worklist items — do not block
          on or retry the parked change. A human applies it later through IntentOS's
          dialog; certify will not report passed=true until it is approved and applied.
        transitions:
          worklist:       { target: burndown, actor: agent, executor: { capability: intentos.worklist } }
          certify:        { target: burndown, actor: agent, executor: { capability: intentos.certify } }
          search:         { target: burndown, actor: agent, executor: { capability: intentos.search_intent_harness } }
          navigate:       { target: burndown, actor: agent, executor: { capability: intentos.navigate } }
          propose:        { target: burndown, actor: agent, executor: { capability: intentos.propose } }
          propose_status: { target: burndown, actor: agent, executor: { capability: intentos.propose_status } }
          finish:         { target: done, actor: agent, executor: { capability: intentos.finish } }
      done:
        terminal: true
